name: CFPP procurement scrape

on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC daily (= 08:00 IST)
  workflow_dispatch:

permissions:
  contents: write          # lets the job push the captured data back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright pandas
          playwright install --with-deps chromium

      # Runs from the repo root, so the script path includes the collectors/ folder.
      # >>> If your file is NOT named cfpp_capture.py, change the name on the next line. <<<
      - name: Run scraper
        run: python collectors/cfpp_capture.py

      - name: Commit captured data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cfpp_output/
          git diff --staged --quiet || git commit -m "Update CFPP data ($(date -u +%Y-%m-%d))"
          git push
