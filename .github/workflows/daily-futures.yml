# .github/workflows/daily-futures.yml
# Runs Mon-Sat at 7:00 PM IST (1:30 PM UTC) — after NCDEX market close at 5 PM
name: Daily Futures Data

on:
  schedule:
    - cron: '30 13 * * 1-6'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4

      # Step 1: Test connectivity first
      - name: Test NCDEX access
        run: python collectors/collect_futures.py --test

      # Step 2: Fetch data
      - name: Fetch futures data
        run: python collectors/collect_futures.py

      # Step 3: Commit
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add data/futures/
          git commit -m "Daily futures $(date -u +%Y-%m-%d)" || echo "No changes"
          git push
