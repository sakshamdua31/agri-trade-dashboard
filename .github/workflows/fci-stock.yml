name: FCI stock scrape

on:
  schedule:
    - cron: '0 3 * * 1'    # every Monday 03:00 UTC
  workflow_dispatch:         # manual "Run workflow" button

permissions:
  contents: write            # lets the job push govt_stocks.json back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30      # full back-scrape is slow; raise if it ever times out
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright pandas lxml       # lxml is needed by pandas.read_html
          playwright install --with-deps chromium

      # Runs from the repo root, so govt_stocks.json is written there.
      # >>> change the filename here if your script is named differently <<<
      - name: Run scraper
        run: python collectors/fci_stock_json.py

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add govt_stocks.json
          git diff --staged --quiet || git commit -m "Update FCI stock data ($(date -u +%Y-%m-%d))"
          git push
