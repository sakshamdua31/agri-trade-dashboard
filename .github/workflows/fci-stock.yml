name: FCI stock collector

on:
  schedule:
    - cron: '0 3 * * 1'    # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright pandas lxml
          playwright install --with-deps chromium

      - name: Run collector
        run: python collectors/fci_stock_collector.py

      - name: Upload debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: |
            debug_page.html
            debug_page.png
            debug_selects.txt
          if-no-files-found: ignore

      - name: Commit data
        run: |
          if [ ! -f fci_stock.json ]; then
            echo "fci_stock.json not produced — the collector got 0 records."
            echo "Download the 'scraper-debug' artifact above to see the page."
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fci_stock.json
          git diff --staged --quiet || git commit -m "Update FCI stock data ($(date -u +%Y-%m-%d))"
          git push
