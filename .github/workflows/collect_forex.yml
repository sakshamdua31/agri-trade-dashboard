name: Daily Forex USD/INR Collection

on:
  schedule:
    # Once daily: 8:30 PM IST = 15:00 UTC (after ECB publishes rates)
    - cron: '0 15 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  collect-forex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run forex collector
        run: python collect_forex.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oilseeds_mir.json
          git diff --staged --quiet || git commit -m "Forex USD/INR $(date -u +%Y-%m-%d) $(date -u +%H:%M)UTC"
          git push
