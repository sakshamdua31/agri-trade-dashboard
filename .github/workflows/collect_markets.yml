name: Collect All Market Prices (Twice Daily)
on:
  schedule:
    - cron: '15 6,14 * * *'
  workflow_dispatch:
jobs:
  collect-markets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all-markets collector
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python collectors/collect_markets.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live/agri_markets.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update all-market prices ($(date -u '+%Y-%m-%d %H:%M'))"
            git pull --rebase
            git push
          fi
