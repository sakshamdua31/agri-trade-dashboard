name: Rice CPI forecast

on:
  workflow_dispatch: {}

permissions:
  contents: write        # lets the workflow commit the JSON back to the repo

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install msal requests pandas statsmodels openpyxl

      - name: Step 1 — run the forecast (writes back into the Excel)
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SITE_ID:       ${{ secrets.SITE_ID }}
        run: python collectors/forecast.py

      - name: Step 2 — serialize the Excel to data/rice_forecast.json
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SITE_ID:       ${{ secrets.SITE_ID }}
        run: python collectors/serialize.py

      - name: Step 3 — commit the JSON if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cpi_forecast.json
          if git diff --staged --quiet; then
            echo "No change in JSON — nothing to commit."
          else
            git commit -m "Update rice forecast JSON [skip ci]"
            git push
          fi
