name: Collect Historical Prices (Monthly — CEDA)

on:
  schedule:
    # 1st of every month at 10:00 UTC (3:30 PM IST)
    # CEDA updates monthly, so one run/month catches new data
    - cron: '0 10 1 * *'
  workflow_dispatch:        # manual "Run workflow" button

jobs:
  collect-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run CEDA history collector
        env:
          CEDA_API_KEY: ${{ secrets.CEDA_API_KEY }}
        run: python collect_history.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agri_history.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update historical prices from CEDA ($(date -u '+%Y-%m-%d'))"
            git pull --rebase
            git push
          fi
