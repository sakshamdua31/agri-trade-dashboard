name: Daily Commodity Price Collection
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
jobs:
  collect-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run price collector
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python collectors/collect_prices.py
      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Commodity prices $(date -u +%Y-%m-%d) $(date -u +%H:%M)UTC"
            git pull --rebase
            git push
          fi
