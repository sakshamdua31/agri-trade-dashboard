name: Collect CPI Data (Monthly)

on:
  schedule:
    # Runs daily at 14:00 UTC (7:30 PM IST). CPI is released mid-month;
    # running daily means a new month is picked up within ~24h of release,
    # instead of waiting for a fixed monthly date.
    - cron: '0 14 * * *'
  workflow_dispatch:        # allows manual "Run workflow" from the Actions tab

jobs:
  collect-cpi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run CPI collector
        run: python collect_cpi.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agri_data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update CPI data ($(date -u '+%Y-%m-%d'))"
            git push
          fi
